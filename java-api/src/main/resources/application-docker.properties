# Perfil "docker": sin secretos. URL, usuario y contraseña llegan por variables de entorno
# (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD).
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
server.port=8080
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
# Detrás de nginx: confiar en X-Forwarded-Proto/For (solo desde proxies de red privada, valor por defecto
# de Tomcat). Sin esto Spring ve http://localhost:80, el Origin https://localhost del navegador le parece
# de otro origen y rechaza los POST/PATCH/DELETE con "Invalid CORS request".
server.forward-headers-strategy=native
