server {
    listen 8080;
    server_name wrapped.local localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name wrapped.local localhost;

    ssl_certificate     /etc/nginx/certs/wrapped.local.pem;
    ssl_certificate_key /etc/nginx/certs/wrapped.local-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/security-headers.conf;
    auth_basic $auth_realm;
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Escrituras: solo desde el propio equipo y con subidas grandes (el .zip pesa unos 15 MB).
    location /api/wrapped/gestion/ {
        if ($gestion_local = 0) { return 403; }
        limit_req zone=api burst=60 nodelay;
        client_max_body_size 300m;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        include /etc/nginx/security-headers.conf;
    }

    # El resto de la API es de solo lectura.
    location /api/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        include /etc/nginx/security-headers.conf;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri /index.html;
    }
}
