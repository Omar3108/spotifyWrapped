worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    access_log    /dev/stdout;
    sendfile      on;
    keepalive_timeout 30;
    client_max_body_size 64k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Rutas temporales en /tmp (el sistema de archivos es de solo lectura)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Sin contraseña en local; con contraseña si se entra por otro host (túnel)
    map $host $auth_realm {
        default          off;   # cambiar a "Spotify Wrapped" para volver a exigir contraseña
        localhost        off;
        wrapped.local    off;
    }

    # La gestión (crear, subir, borrar) solo se acepta desde el propio equipo. Todo lo que llega por el
    # túnel de Cloudflare trae CF-Connecting-IP (y un Host distinto), así que nunca coincide.
    map "$host:$http_cf_connecting_ip" $gestion_local {
        default 0;
        "~^(localhost|wrapped\.local|127\.0\.0\.1):$" 1;
    }

    include /etc/nginx/conf.d/*.conf;
}
